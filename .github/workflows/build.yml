name: 构建 APK

on:
  push:

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - name: 运行 actions/checkout@v4
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python‑version: "3.11"

      - name: 安装系统依赖项
        run: |
          sudo apt‑get update
          sudo apt‑get install -y git zip unzip openjdk‑17‑jdk autoconf libtool pkg‑config zlib1g‑dev libncurses5‑dev libncursesw5‑dev libssl‑dev libffi‑dev

      - name: 安装 Buildozer
        run: python3 -m pip install --user buildozer

      - name: 构建 APK
        run: |
          buildozer init
          sed -i 's/requirements = python3/requirements = python3,kivy/' buildozer.spec
          buildozer android debug

      - name: 上传 APK 文件
        uses: actions/upload‑artifact@v4
        with:
          name: my‑apk
          path: bin/*.apk
